# MudSort for openAC-rust: mudzereli's mudsort (a Decal inventory sorter)
# ported to a WebAssembly plugin. The sort core is pinned to mudsort's own
# behaviour by golden files its own code generated (tools/golden).
[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.dependencies]
# The plugin SDK (MIT), from the openAC-rust repository, pinned to a commit
# of its main branch.
openac-plugin = { git = "https://github.com/eriknihlen/openac-rust", rev = "1b8312d5f3ce9f3c988b7221dadade227cc80ed6" }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The plugin build: a panic is a trap, so the client unloads the plugin and
# reports why. Optimised for speed, as Mosswart Massacre is: the client counts
# fuel per instruction, and a sort compares strings many times per item.
[profile.release]
panic = "abort"
opt-level = 3
lto = true
codegen-units = 1
