[package]
name = "mudsort"
description = "MudSort as an openAC-rust WebAssembly plugin: sorts a pack's items by a recipe of item properties and moves them, in order, into a pack, a chest or another player."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
# MIT, except src/alphanum.rs (a port of mudsort's LGPL AlphanumComparator.cs).
license = "MIT AND LGPL-2.1-or-later"
publish.workspace = true

[lib]
# cdylib: the plugin's .wasm; rlib: the native tests link it.
crate-type = ["cdylib", "rlib"]

[dependencies]
openac-plugin.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ac-plugin-abi = { workspace = true, features = ["ui-host"] }
ac-plugin-ui.workspace = true

[lints]
workspace = true
